                              <td className="px-1 py-1.5 bg-sky-50/20 text-center"><span className={`text-xs font-semibold ${isTrans ? 'text-slate-300' : isOver ? 'text-rose-600' : 'text-sky-700'}`}>{total == null ? '' : round1(total)}</span></td>
                            </Fragment>
                          );
                        })}
                        {regularItems.map((item, itemIdx) => {
                          const val = state.regularScores[stu.id]?.[item.id];
                          const isOver = typeof val === 'number' && val > item.max;
                          return (
                            <td key={item.id} className="px-1 py-1.5 bg-amber-50/20 border-l border-amber-50">
                              <input type="number" className={getColClass(isOver, false)} value={val ?? ''} onChange={e => update(s => { s.regularScores[stu.id] ??= {}; s.regularScores[stu.id][item.id] = e.target.value === '' ? null : Number(e.target.value); })} onPaste={e => handlePaste(e, filteredIdx, 4 + exams.length * 2 + itemIdx)} />
                            </td>
                          );
                        })}
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          </Section>
        </div>
      );
    };

    // --- 成績一覧タブ ---
    const ResultsTab = ({ state }) => {
      const results = useMemo(() => calculateAllResults(state), [state]);
      const terms = state.settings.terms;
      const classes = useMemo(() => [...new Set(state.students.map(s => s.cls))].filter(Boolean).sort(), [state.students]);
      const courses = useMemo(() => [...new Set(state.students.map(s => s.course).filter(Boolean))].sort(), [state.students]);
      const finalGrades = useMemo(() => state.settings.finalScale.map(s => Number(s.label)).filter(Number.isFinite).sort((a, b) => b - a), [state.settings.finalScale]);

      const [filters, setFilters] = useState({ cls: [], course: [], termGrades: {}, annualGrades: [], ranges: {} });
      const [isStatsOpen, setIsStatsOpen] = useState(true);

      const toggleFilter = (key, val) => setFilters(prev => ({ ...prev, [key]: prev[key].includes(val) ? prev[key].filter(v => v !== val) : [...prev[key], val] }));
      const toggleTermGrade = (termId, val) => setFilters(prev => { const arr = prev.termGrades[termId] ?? []; return { ...prev, termGrades: { ...prev.termGrades, [termId]: arr.includes(val) ? arr.filter(v => v !== val) : [...arr, val] } }; });
      const setRange = (termId, key, type, val) => setFilters(prev => { const rKey = `${termId}:${key}`; const current = prev.ranges[rKey] ?? { min: '', max: '' }; return { ...prev, ranges: { ...prev.ranges, [rKey]: { ...current, [type]: val } } }; });
      const clearRange = (termId, key) => setFilters(prev => { const next = { ...prev.ranges }; delete next[`${termId}:${key}`]; return { ...prev, ranges: next }; });
      const getRange = (termId, key) => filters.ranges[`${termId}:${key}`] ?? { min: '', max: '' };
      const isRangeActive = (termId, key) => { const r = filters.ranges[`${termId}:${key}`]; return !!r && (r.min !== '' || r.max !== ''); };
      const clearAllFilters = () => setFilters({ cls: [], course: [], termGrades: {}, annualGrades: [], ranges: {} });

      const isFiltering = filters.cls.length > 0 || filters.course.length > 0 || Object.values(filters.termGrades).some(arr => arr.length > 0) || filters.annualGrades.length > 0 || Object.keys(filters.ranges).length > 0;

      const filteredResults = useMemo(() => results.filter(res => {
        if (filters.cls.length && !filters.cls.includes(res.cls)) return false;
        if (filters.course.length && !filters.course.includes(res.course)) return false;
        for (const term of terms) {
          const tg = filters.termGrades[term.id] ?? [];
          if (tg.length) {
            const tr = res.terms.find(t => t.termId === term.id);
            const label = tr?.finalLabel == null ? NaN : Number(tr.finalLabel);
            if (!Number.isFinite(label) || !tg.includes(label)) return false;
          }
        }
        if (filters.annualGrades.length) {
          const label = res.annualLabel == null ? NaN : Number(res.annualLabel);
          if (!Number.isFinite(label) || !filters.annualGrades.includes(label)) return false;
        }
        for (const term of terms) {
          const tr = res.terms.find(t => t.termId === term.id);
          if (tr) {
            for (const col of [{ key: 'examAvg' }, { key: 'k' }, { key: 's' }, { key: 't' }, { key: 'sum' }]) {
              const { min, max } = getRange(term.id, col.key);
              const minVal = parseFloatSafe(min), maxVal = parseFloatSafe(max);
              const val = col.key === 'examAvg' ? tr.examAverage : col.key === 'sum' ? (Object.values(tr.viewpoints).some(vp => vp.grade) ? tr.sumValue : null) : (tr.viewpoints[col.key].grade ? tr.viewpoints[col.key].point : null);
              if ((minVal != null || maxVal != null) && !isWithinRange(val, minVal, maxVal)) return false;
            }
          }
        }
        return true;
      }), [results, filters, terms]);

      const validResults = useMemo(() => filteredResults.filter(r => !r.transferred), [filteredResults]);

      const termAvgs = useMemo(() => terms.map((term, i) => ({
        examAvg: calculateAverage(validResults.map(r => r.terms[i].examAverage)),
        k: calculateAverage(validResults.map(r => r.terms[i].viewpoints.k.grade ? r.terms[i].viewpoints.k.point : null)),
        s: calculateAverage(validResults.map(r => r.terms[i].viewpoints.s.grade ? r.terms[i].viewpoints.s.point : null)),
        t: calculateAverage(validResults.map(r => r.terms[i].viewpoints.t.grade ? r.terms[i].viewpoints.t.point : null)),
        sumAvg: calculateAverage(validResults.filter(r => Object.values(r.terms[i].viewpoints).some(vp => vp.grade)).map(r => r.terms[i].sumValue))
      })), [validResults, terms]);

      const stats = useMemo(() => {
        const calcStat = (arr) => {
          if (!arr.length) return { avg: null, sd: null, dist: new Map(), total: 0 };
          const avg = arr.reduce((sum, x) => sum + x, 0) / arr.length;
          const sd = Math.sqrt(arr.reduce((sum, x) => sum + (x - avg) ** 2, 0) / arr.length);
          const dist = new Map();
          arr.forEach(x => dist.set(x, (dist.get(x) ?? 0) + 1));
          return { avg, sd, dist, total: arr.length };
        };
        const getNum = (val) => { const n = Number(val); return Number.isFinite(n) ? n : null; };
        return {
          termStats: terms.map((term, i) => calcStat(validResults.map(r => getNum(r.terms[i].finalLabel)).filter(x => x != null))),
          annual: calcStat(validResults.map(r => getNum(r.annualLabel)).filter(x => x != null))
        };
      }, [validResults, terms]);

      return (
        <Section title="成績一覧(自動集計)" icon="ri-bar-chart-2-line" desc="試験平均・観点別評点・評価・換算値・評定を一覧表示します。見出しの漏斗アイコンからエクセルのように絞り込みでき、絞り込みに応じて平均・統計が再計算されます">
          
          <div className="flex flex-wrap gap-4 mb-4 text-[11px] text-slate-500">
            {state.settings.gradeScale.map(gs => (
              <span key={gs.id} className="inline-flex items-center gap-1.5">
                <span className={`inline-flex items-center justify-center min-w-[30px] px-2 py-0.5 rounded-md font-semibold ${getToneClass(gs.tone)}`}>{gs.label}</span>
                ≥ {(gs.minRatio * 100).toFixed(0)}% (換算値 {gs.value})
              </span>
            ))}
          </div>

          <div className="mb-5 border-b border-slate-200 pb-5">
            <div className="flex items-center justify-between cursor-pointer group" onClick={() => setIsStatsOpen(!isStatsOpen)}>
              <div className="flex items-center gap-2">
                <i className="ri-line-chart-line text-emerald-600"></i>
                <h4 className="text-sm font-semibold text-slate-700 group-hover:text-emerald-500 transition-colors">評定の統計（平均・標準偏差・割合）</h4>
                <span className="text-xs text-slate-400">対象 {validResults.length} 名</span>
              </div>
              <button className="text-slate-400 group-hover:text-emerald-500 transition-colors focus:outline-none">
                <i className={isStatsOpen ? "ri-arrow-up-s-line text-xl" : "ri-arrow-down-s-line text-xl"}></i>
              </button>
            </div>
            
            {isStatsOpen && (
              <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mt-4">
                {[...terms.map((t, i) => ({ key: t.id, title: t.name, s: stats.termStats[i] })), { key: 'annual', title: '年間', s: stats.annual }].map(stat => (
                  <div key={stat.key} className="rounded-lg border border-slate-200 bg-slate-50/70 p-4">
                    <div className="text-xs font-semibold text-slate-600 mb-3">{stat.title}</div>
                    <div className="flex flex-wrap gap-x-6 gap-y-2 mb-4 text-xs">
                      <span className="inline-flex items-center gap-1 text-slate-500">平均<span className="font-semibold text-slate-800">{stat.s.avg == null ? '–' : stat.s.avg.toFixed(2)}</span></span>
                      <span className="inline-flex items-center gap-1 text-slate-500">標準偏差<span className="font-semibold text-slate-800">{stat.s.sd == null ? '–' : stat.s.sd.toFixed(2)}</span></span>
                    </div>
                    <div className="space-y-1.5">
                      {finalGrades.map(grade => {
                        const count = stat.s.dist.get(grade) ?? 0;
                        const pct = stat.s.total ? (count / stat.s.total) * 100 : 0;
                        return (
                          <div key={grade} className="flex items-center gap-2">
                            <span className="w-5 text-right text-xs font-semibold text-slate-600">{grade}</span>
                            <div className="flex-1 h-2 rounded-full bg-slate-100 overflow-hidden">
                              <div className={`h-full rounded-full ${getGradeColor(grade)}`} style={{ width: `${pct}%` }}></div>
                            </div>
                            <span className="w-24 text-right text-[11px] text-slate-500 whitespace-nowrap">{count}人 ({pct.toFixed(0)}%)</span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          <div className="flex items-center justify-between mb-3">
            <div className="flex items-center gap-2 text-xs text-slate-500">
              <i className="ri-filter-3-line text-emerald-600"></i>
              <span>{filteredResults.length} 件表示</span>
              {isFiltering && <span className="text-emerald-600 font-medium">絞り込み中</span>}
            </div>
            {isFiltering && (
              <button type="button" onClick={clearAllFilters} className="px-2.5 py-1 text-xs rounded-md text-slate-500 hover:text-emerald-700 hover:bg-emerald-50 cursor-pointer transition whitespace-nowrap">
                <i className="ri-eraser-line mr-1"></i>絞り込みをクリア
              </button>
            )}
          </div>

          <div className="overflow-auto max-h-[70vh] rounded-lg border border-slate-200">
            <table className="min-w-full text-sm border-separate border-spacing-0">
              <thead className="sticky top-0 z-10">
                <tr className="text-[11px] text-slate-500">
                  <th rowSpan={3} className="px-2 py-2 text-left align-middle bg-slate-100 border-b border-slate-200">No</th>
                  <th rowSpan={3} className="px-2 py-2 text-left align-middle bg-slate-100 border-b border-slate-200">
                    <div className="flex items-center">
                      <span>クラス</span>
                      <FilterPopover label="クラス" active={filters.cls.length > 0} onClear={() => setFilters(p => ({ ...p, cls: [] }))}>
                        <CheckboxFilter options={classes.map(c => ({ value: c, label: c }))} selected={filters.cls} onToggle={v => toggleFilter('cls', v)} />
                      </FilterPopover>
                    </div>
                  </th>
                  <th rowSpan={3} className="px-2 py-2 text-left align-middle bg-slate-100 border-b border-slate-200">
                    <div className="flex items-center">
                      <span>コース</span>
                      <FilterPopover label="コース" active={filters.course.length > 0} onClear={() => setFilters(p => ({ ...p, course: [] }))}>
                        <CheckboxFilter options={courses.map(c => ({ value: c, label: c }))} selected={filters.course} onToggle={v => toggleFilter('course', v)} />
                      </FilterPopover>
                    </div>
                  </th>
                  <th rowSpan={3} className="px-2 py-2 text-left align-middle bg-slate-100 border-b border-slate-200">氏名</th>
                  {terms.map(term => <th key={term.id} colSpan={6} className="px-2 py-1.5 border-l border-slate-200 text-center font-semibold bg-slate-100 border-b border-slate-200">{term.name}</th>)}
                  <th className="px-2 py-1 border-l border-slate-200 text-center bg-emerald-100 border-b border-slate-200">
                    <span className="block text-[9px] font-normal leading-tight text-emerald-700">平均</span>
                    <span className="font-semibold text-emerald-800">{stats.annual.avg == null ? '–' : stats.annual.avg.toFixed(1)}</span>
                  </th>
                </tr>
                <tr className="text-[10px]">
                  {termAvgs.map((avg, i) => (
                    <Fragment key={terms[i].id}>
                      <th className="px-1.5 py-1 border-l border-slate-200 bg-emerald-100 border-b border-slate-200"><span className="block text-[9px] font-normal leading-tight text-emerald-700">平均</span><span className="font-semibold text-emerald-800">{avg.examAvg == null ? '–' : avg.examAvg.toFixed(1)}</span></th>
                      <th className="px-1.5 py-1 bg-emerald-100 border-b border-slate-200"><span className="block text-[9px] font-normal leading-tight text-emerald-700">平均</span><span className="font-semibold text-emerald-800">{avg.k == null ? '–' : avg.k.toFixed(1)}</span></th>
                      <th className="px-1.5 py-1 bg-emerald-100 border-b border-slate-200"><span className="block text-[9px] font-normal leading-tight text-emerald-700">平均</span><span className="font-semibold text-emerald-800">{avg.s == null ? '–' : avg.s.toFixed(1)}</span></th>
                      <th className="px-1.5 py-1 bg-emerald-100 border-b border-slate-200"><span className="block text-[9px] font-normal leading-tight text-emerald-700">平均</span><span className="font-semibold text-emerald-800">{avg.t == null ? '–' : avg.t.toFixed(1)}</span></th>
                      <th className="px-1.5 py-1 bg-emerald-100 border-b border-slate-200"><span className="block text-[9px] font-normal leading-tight text-emerald-700">平均</span><span className="font-semibold text-emerald-800">{avg.sumAvg == null ? '–' : avg.sumAvg.toFixed(1)}</span></th>
                      <th className="px-1.5 py-1 bg-emerald-100 border-b border-slate-200"><span className="block text-[9px] font-normal leading-tight text-emerald-700">平均</span><span className="font-semibold text-emerald-800">{stats.termStats[i].avg == null ? '–' : stats.termStats[i].avg.toFixed(1)}</span></th>
                    </Fragment>
                  ))}
                  <th rowSpan={2} className="px-2 py-2 border-l border-slate-200 text-center align-middle bg-emerald-100 text-emerald-700 font-semibold whitespace-nowrap border-b border-emerald-200">
                    <div className="flex items-center justify-center">
                      <span>年間評定</span>
                      <FilterPopover label="年間評定" active={filters.annualGrades.length > 0} onClear={() => setFilters(p => ({ ...p, annualGrades: [] }))}>
                        <CheckboxFilter options={finalGrades.map(g => ({ value: String(g), label: String(g) }))} selected={filters.annualGrades.map(String)} onToggle={v => toggleFilter('annualGrades', Number(v))} />
                      </FilterPopover>
                    </div>
                  </th>
                </tr>
                <tr className="text-[11px] text-slate-500">
                  {terms.map(term => (
                    <Fragment key={term.id}>
                      {[{ key: 'examAvg', label: '試験平均点' }, { key: 'k', label: '知識' }, { key: 's', label: '思考' }, { key: 't', label: '態度' }, { key: 'sum', label: '換算合計' }].map((col, idx) => (
                        <th key={col.key} className={`px-1.5 py-1 bg-slate-100 border-b border-slate-200 ${idx === 0 ? 'border-l border-slate-200' : ''}`}>
                          <div className="flex items-center justify-center">
                            <span className="whitespace-nowrap">{col.label}</span>
                            <FilterPopover label={`${term.name} ${col.label}`} active={isRangeActive(term.id, col.key)} onClear={() => clearRange(term.id, col.key)}>
                              <RangeFilter min={getRange(term.id, col.key).min} max={getRange(term.id, col.key).max} onMin={v => setRange(term.id, col.key, 'min', v)} onMax={v => setRange(term.id, col.key, 'max', v)} />
                            </FilterPopover>
                          </div>
                        </th>
                      ))}
                      <th className="px-1.5 py-1 bg-slate-100 border-b border-slate-200">
                        <div className="flex items-center justify-center">
                          <span className="whitespace-nowrap">評定</span>
                          <FilterPopover label={`${term.name} 評定`} active={(filters.termGrades[term.id] ?? []).length > 0} onClear={() => setFilters(p => ({ ...p, termGrades: { ...p.termGrades, [term.id]: [] } }))}>
                            <CheckboxFilter options={finalGrades.map(g => ({ value: String(g), label: String(g) }))} selected={(filters.termGrades[term.id] ?? []).map(String)} onToggle={v => toggleTermGrade(term.id, Number(v))} />
                          </FilterPopover>
                        </div>
                      </th>
                    </Fragment>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filteredResults.length === 0 ? (
                  <tr><td colSpan={100} className="px-4 py-8 text-center text-slate-400 text-sm">該当する生徒がいません</td></tr>
                ) : filteredResults.map(res => (
                  <tr key={res.studentId} className={res.transferred ? 'bg-slate-50/80' : 'hover:bg-slate-50/50'}>
                    <td className={`px-2 py-2 ${res.transferred ? 'text-slate-400' : 'text-slate-500'}`}>{res.no}</td>
                    <td className={`px-2 py-2 ${res.transferred ? 'text-slate-400' : 'text-slate-500'}`}>{res.cls}</td>
                    <td className={`px-2 py-2 ${res.transferred ? 'text-slate-400' : 'text-slate-500'}`}>{res.course}</td>
                    <td className={`px-2 py-2 font-medium whitespace-nowrap ${res.transferred ? 'text-slate-400' : 'text-slate-800'}`}>{res.name}</td>
                    {res.terms.map(t => (
                      <Fragment key={t.termId}>
                        <td className="px-1.5 py-2 text-center border-l border-slate-100 text-slate-600">{res.transferred ? <span className="text-slate-400">欠</span> : t.examAverage == null ? '-' : t.examAverage.toFixed(1)}</td>
                        {VIEWPOINTS.map(vp => {
                          const r = t.viewpoints[vp.key];
                          return (
                            <td key={vp.key} className="px-1.5 py-2 text-center border-l border-slate-100">
                              {res.transferred ? <span className="text-slate-400">欠</span> : r.grade ? (
                                <div className="flex flex-col items-center gap-0.5">
                                  <span className="text-sm font-semibold text-slate-800">{r.point.toFixed(1)}</span>
                                  <span className={`inline-flex items-center justify-center min-w-[32px] px-1.5 py-0.5 rounded-md text-[11px] font-semibold ${getToneClass(r.grade.tone)}`}>{r.grade.label}</span>
                                </div>
                              ) : <span className="text-slate-300">-</span>}
                            </td>
                          );
                        })}
                        <td className="px-1.5 py-2 text-center text-slate-600 font-medium">{res.transferred ? <span className="text-slate-400">欠</span> : t.sumValue}</td>
                        <td className="px-1.5 py-2 text-center">{res.transferred ? <span className="inline-flex items-center justify-center w-7 h-7 rounded-full bg-slate-200 text-slate-400 text-sm font-bold">欠</span> : <span className="inline-flex items-center justify-center w-7 h-7 rounded-full bg-slate-700 text-white text-sm font-bold">{t.finalLabel ?? '-'}</span>}</td>
                      </Fragment>
                    ))}
                    <td className="px-2 py-2 text-center border-l border-slate-200 bg-emerald-50/50">{res.transferred ? <span className="inline-flex items-center justify-center w-9 h-9 rounded-full bg-slate-200 text-slate-400 text-base font-bold">欠</span> : <span className="inline-flex items-center justify-center w-9 h-9 rounded-full bg-emerald-500 text-white text-base font-bold">{res.annualLabel ?? '-'}</span>}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </Section>
      );
    };

    // --- メインアプリケーション ---
    const App = () => {
      const { state, setState, reset } = useAppState();
      const [activeTab, setActiveTab] = useState('input');
      const [toastMsg, setToastMsg] = useState(null);
      const [showResetConfirm, setShowResetConfirm] = useState(false);
      const fileInputRef = useRef(null);

      const showToast = (msg) => { setToastMsg(msg); setTimeout(() => setToastMsg(null), 2000); };

      const downloadFile = (content, filename, type) => {
        const blob = new Blob([content], { type });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url; a.download = filename; a.click();
        URL.revokeObjectURL(url);
      };

      const exportJSON = () => {
        downloadFile(JSON.stringify(state, null, 2), `grade-data-${new Date().toISOString().slice(0, 10)}.json`, 'application/json');
        showToast('JSON をエクスポートしました');
      };

      const exportCSV = () => {
        const results = calculateAllResults(state);
        const header = ['No', 'クラス', 'コース', '氏名'];
        state.settings.terms.forEach(term => {
          VIEWPOINTS.forEach(vp => header.push(`${term.name}${vp.label}`));
          header.push(`${term.name}換算合計`, `${term.name}評定`);
        });
        header.push('年間評定');
        
        const rows = [header];
        results.forEach(res => {
          const row = [String(res.no), res.cls, res.course, res.name];
          res.terms.forEach(term => {
            VIEWPOINTS.forEach(vp => row.push(res.transferred ? '欠' : (term.viewpoints[vp.key].grade?.label ?? '')));
            row.push(res.transferred ? '欠' : String(term.sumValue), res.transferred ? '欠' : (term.finalLabel ?? ''));
          });
          row.push(res.transferred ? '欠' : (res.annualLabel ?? ''));
          rows.push(row);
        });
        
        const csv = '\uFEFF' + rows.map(r => r.map(c => `"${c.replace(/"/g, '""')}"`).join(',')).join('\n');
        downloadFile(csv, `results-${new Date().toISOString().slice(0, 10)}.csv`, 'text/csv');
        showToast('成績をCSVで出力しました');
      };

      const importJSON = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          try {
            setState(migrateState(JSON.parse(String(reader.result))));
            showToast('データを読み込みました');
          } catch { showToast('読み込みに失敗しました'); }
        };
        reader.readAsText(file);
        e.target.value = '';
      };

      const saveOffline = () => {
        const html = document.documentElement.outerHTML;
        const scriptTag = `<script>window.__INITIAL_STATE__ = ${JSON.stringify(state)};<\/script>`;
        let newHtml;
        if (html.includes('window.__INITIAL_STATE__')) {
          newHtml = html.replace(/<script>window\.__INITIAL_STATE__[\s\S]*?<\/script>/, scriptTag);
        } else {
          newHtml = html.replace('<head>', `<head>\n  ${scriptTag}`);
        }
        downloadFile(`<!DOCTYPE html>\n${newHtml}`, `grade-app-offline-${new Date().toISOString().slice(0,10)}.html`, 'text/html');
        showToast('オフライン用HTMLを保存しました');
      };

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans">
          <div className="sticky top-0 z-30 bg-white/95 backdrop-blur border-b border-slate-200 shadow-sm">
            <div className="w-[95%] mx-auto px-6">
              <div className="py-3 flex items-center justify-between gap-4 flex-wrap">
                <div className="flex items-center gap-3">
                  <div className="w-9 h-9 flex items-center justify-center rounded-lg bg-emerald-500 text-white shadow-sm">
                    <i className="ri-book-open-line text-lg"></i>
                  </div>
                  <div>
                    <h1 className="text-base font-semibold text-slate-800">成績処理システム</h1>
                    <p className="text-xs text-slate-500">3観点評価 → 換算値 → 評定</p>
                  </div>
                </div>
                <div className="flex items-center gap-2 flex-wrap">
<!--                  <button onClick={saveOffline} className="px-3 py-1.5 text-xs rounded-md bg-emerald-500 text-white hover:bg-emerald-600 whitespace-nowrap cursor-pointer inline-flex items-center gap-1.5 shadow-sm"><i className="ri-download-cloud-2-line"></i>オフライン保存</button>-->
                  <button onClick={exportJSON} className="px-3 py-1.5 text-xs rounded-md border border-slate-200 text-slate-700 hover:bg-slate-100 whitespace-nowrap cursor-pointer inline-flex items-center gap-1.5"><i className="ri-download-line"></i>JSON保存</button>
                  <button onClick={exportCSV} className="px-3 py-1.5 text-xs rounded-md border border-slate-200 text-slate-700 hover:bg-slate-100 whitespace-nowrap cursor-pointer inline-flex items-center gap-1.5"><i className="ri-file-excel-2-line"></i>成績CSV</button>
                  <button onClick={() => fileInputRef.current?.click()} className="px-3 py-1.5 text-xs rounded-md border border-slate-200 text-slate-700 hover:bg-slate-100 whitespace-nowrap cursor-pointer inline-flex items-center gap-1.5"><i className="ri-upload-line"></i>読込</button>
                  <input ref={fileInputRef} type="file" accept=".json" className="hidden" onChange={importJSON} />
                  <button onClick={() => setShowResetConfirm(true)} className="px-3 py-1.5 text-xs rounded-md bg-rose-50 border border-rose-200 text-rose-600 hover:bg-rose-100 whitespace-nowrap cursor-pointer inline-flex items-center gap-1.5"><i className="ri-refresh-line"></i>初期化</button>
                </div>
              </div>
              <Tabs tabs={TABS} current={activeTab} onChange={setActiveTab} />
            </div>
          </div>

          <main className="w-[95%] mx-auto px-6 py-6">
            {activeTab === 'input' && <InputTab state={state} setState={setState} showToast={showToast} />}
            {activeTab === 'results' && <ResultsTab state={state} />}
            {activeTab === 'settings' && <SettingsTab state={state} setState={setState} />}
          </main>

          {toastMsg && <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-lg bg-slate-800 text-white text-sm shadow-lg animate-fade-in-up">{toastMsg}</div>}

          {showResetConfirm && (
            <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/40 backdrop-blur-sm">
              <div className="bg-white rounded-lg p-6 w-[340px] shadow-xl">
                <h3 className="text-sm font-semibold text-slate-800 mb-2">初期化の確認</h3>
                <p className="text-xs text-slate-500 mb-5 leading-relaxed">入力中のデータをすべて消してサンプルの初期状態に戻します。よろしいですか?</p>
                <div className="flex justify-end gap-2">
                  <button onClick={() => setShowResetConfirm(false)} className="px-3 py-1.5 text-xs rounded-md border border-slate-200 text-slate-600 hover:bg-slate-100 whitespace-nowrap cursor-pointer">キャンセル</button>
                  <button onClick={() => { reset(); setShowResetConfirm(false); showToast('初期化しました'); }} className="px-3 py-1.5 text-xs rounded-md bg-rose-500 text-white hover:bg-rose-600 whitespace-nowrap cursor-pointer">初期化する</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    };

    const root = createRoot(document.getElementById('root'));
    root.render(<StrictMode><App /></StrictMode>);
  </script>
</body>
</html>
